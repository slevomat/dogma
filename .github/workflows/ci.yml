name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  checks:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5', '8.6']
        include:
          - php: '8.5'
            experimental: false
          - php: '8.6'
            experimental: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: calendar, mbstring, intl, iconv
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Lint
        run: php vendor/php-parallel-lint/php-parallel-lint/parallel-lint src tests

      - name: Tests
        run: composer run tests:run

      - name: PHPStan
        run: php vendor/phpstan/phpstan/phpstan analyse --memory-limit 1G -c build/PHPStan/phpstan.neon
        continue-on-error: true # TODO: make blocking after phpstan/phpcs cleanup phase

      - name: PHPCS source
        run: php vendor/squizlabs/php_codesniffer/bin/phpcs --standard=build/CodeSniffer/ruleset.xml src
        continue-on-error: true # TODO: make blocking after phpstan/phpcs cleanup phase

      - name: PHPCS tests
        run: php vendor/squizlabs/php_codesniffer/bin/phpcs --standard=build/CodeSniffer/ruleset-tests.xml tests
